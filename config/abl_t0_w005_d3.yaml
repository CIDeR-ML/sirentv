# abl_t0_w005_d3 -- GENERATED by scripts/make_ablation_configs.py, do not hand-edit.
# Single branch (t0_net, keys=['t0']) at omega_0=5, depth=3.
#
# Branch is trained ALONE: the three branches of the q3 model are decoupled (separate
# nets, one loss per key, target-derived quantiles_mask, per-branch clip_grad), so this
# is equivalent to the joint run and the checkpoints merge back with strict=True.
# Derived from stage0_q3_quantile_3br.yaml -- see that file for the loss rationale.
# 1000 epochs: this ranks omega_0 by CONVERGENCE SPEED, not final quality.
#
# !! PLACEHOLDER omega_0 !! Stage B should scan depth at whatever omega_0 stage A
# selects, which was unknown when this file was written. Regenerate with:
#   python3 scripts/make_ablation_configs.py --stage B --omega-t0 <value>
photonlib:
  filepath: /pscratch/sd/j/junjiex/SIREN/data/full_wvfm_plib_b05_quantile_prod_lite_fixed.h5
  lazy: true
  mode: log_quantile
  combine_every_quantile: 2
  n_photon: 3.0e7
  device: cpu
physics:
  R_index: 1.233
device:
  type: cuda
model:
  mode: quantile_cdf
  network:
    type: MultiBranchSiren
    in_features: 6
    n_quantile: 256
    outermost_linear: true
    branches:
    - name: t0_net
      keys:
      - t0
      hidden_features: 256
      hidden_layers: 3
      first_omega_0: 5.0
      hidden_omega_0: 5.0
  output_scale:
    fix: true
transform_vis:
  vmax: 1.0
  eps: 1.0e-08
  sin_out: false
data:
  n_pmt: 81
  weight:
    quantiles:
      enable: false
    v:
      enable: true
      factor: 5000.0
      threshold: 1.0e-08
    t0:
      enable: false
  loader:
    batch_size: 512
    drop_last: true
    num_workers: 16
    prefetch_factor: 4
    pin_memory: true
    shuffle: true
    load_pos: true
  dataset:
    type: QuantilePLibDataset
  target_keys:
  - t0
logger:
  type: wandb
  entity: junjiex-stanford-university
  run_dir: /pscratch/sd/j/junjiex/SIREN/logs
  dir_name: logs_abl_t0_w005_d3
  file_name: log.csv
  grad_norm:
    enabled: true
    log_per_layer: true
    log_frequency: 77
  log_every_nsteps: 77
  project: sirentv_omega_depth
  name: abl_t0_w005_d3
train:
  clip_grad:
    t0_net: 1.0
  loss:
  - type: SmoothL1Loss
    key: t0
    weight: 1.0
  regularization: null
  reduction: sum
  max_epochs: 1000
  optimizer_class: AdamW
  optimizer_param:
    lr: 1.0e-05
  resume: false
  save_every_epochs: 100
  save_every_iterations: -1
  scheduler_class: CosineAnnealingLR
  scheduler_param:
    T_max: 1000
    eta_min: 1.0e-07
  seed: 0
