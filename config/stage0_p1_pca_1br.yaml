compressed_plib:
    filepath: /pscratch/sd/j/junjiex/SIREN/data/compressed_plib_b05_quantile_log_prod_lite_n50.h5
    lazy: true
    n_components: 50
    n_photon: 3.0e7
    device: cpu
    normalize_coeffs: true
    evr_weight_coeffs: false
    weight_power: 1.0 # power of the standard deviation for the coefficient weight. Default is 1.0, which is equivalent to u/sigma penalty loss. 0 is the same as unormalized L2 loss, and 2 is the as plain L2 loss on the normalized coeffs.
# eval-only: true (uncompressed) quantile function, for measuring the PCA-reconstruction
# ceiling (compressed target vs. raw) separately from model error. Ignored by training.
raw_quantile_plib:
    filepath: /pscratch/sd/j/junjiex/SIREN/data/full_wvfm_plib_b05_quantile_prod_lite_fixed.h5
    mode: quantile
physics:
    R_index: 1.233
device:
    type: cuda
model:
  ckpt_file: null
  mode: pca_cdf
  network:
    type: MultiBranchSiren
    in_features: 6
    n_components: 50
    outermost_linear: true
    # Topology ladder rung: omega_0 is 30 on every branch, so this run varies ONLY the
    # number of branches. The omega_0 sweep is a separate, 3-branch-only set.
    branches:
      - name: net
        keys: [v, t0, coeffs]
        hidden_features: 512
        hidden_layers: 6
        first_omega_0: 30.0
        hidden_omega_0: 30.0
  output_scale:
    fix: true
transform_vis:
    vmax: 1.0
    eps: 1.e-8
    sin_out: false
data:
    n_pmt: 81
    use_gradient_supervision: False  # Enable gradient precomputation
    weight:
      coeffs:
        enable: false
      v:
        enable: true
        factor: 5000.0
        threshold: 1.0e-08
      t0:
        enable: false
    loader:
      batch_size: 512
      drop_last: true
      num_workers: 16
      prefetch_factor: 4
      pin_memory: true
      shuffle: true
      load_pos: true
    dataset:
      type: CompressedPLibDataset
logger:
    type: wandb
    entity: junjiex-stanford-university
    run_dir: /pscratch/sd/j/junjiex/SIREN/logs
    dir_name: logs_stage0_p1_pca_1br
    file_name: log.csv
    grad_norm:
      enabled: true
      log_per_layer: true
      log_frequency: 77
    log_every_nsteps: 77
    project: sirentv_ablations
    name: stage0_p1_pca_1br
    infer_fn:
      type: PCAInfer
    analysis:
      - func: bias
        suffix: coeffs
        key: coeffs
        threshold: null
      - func: bias
        suffix: vis
        key: v_linear
        threshold: 1.0e-06
      - func: abs_bias
        suffix: t0
        key: t0
        threshold: 1.0e-02
        signed: True
train:
    clip_grad: {net: 1.0}
    loss:
      - type: WeightedL2Loss
        key: coeffs
        weight: 1.0
      # Poisson NLL on visibility, not SmoothL1: the target is a Monte Carlo count
      # estimate, so its noise is heteroscedastic -- Var(t) ~ p/n, meaning
      # low-visibility voxels have proportionally noisier targets. An L2/SmoothL1
      # loss assumes constant variance and so over-weights exactly the far-field
      # region where the target is least trustworthy.
      #
      # inv_xform and n_photon are NOT set here -- build_losses injects both from
      # this file's own transform_vis and plib n_photon (training/utils.py), which
      # is what keeps them from drifting out of sync with the dataset.
      #
      # weight 1.0e-7 is NOT a target-scale correction: the loss multiplies by
      # n_photon = 3.0e7 internally (that factor is what makes the fraction-domain
      # formula n*(p - t*log p) gradient-equivalent to the true count-domain NLL --
      # see the derivation in loss/poisson.py). 3.0e7 * 1.0e-7 = 3, so the EFFECTIVE
      # prefactor on this term relative to the other losses is ~3, not 1e-7.
      - type: WeightedPoissonNLLLoss
        key: v
        weight: 1.0e-7
      - type: SmoothL1Loss
        key: t0
        weight: 1.0
    regularization: null
    reduction: sum
    max_epochs: 5000
    optimizer_class: AdamW
    optimizer_param:
      lr: 1.0e-05
    resume: false
    save_every_epochs: 100
    save_every_iterations: -1
    scheduler_class: CosineAnnealingLR
    scheduler_param:
      T_max: 2000
      eta_min: 1.0e-07
