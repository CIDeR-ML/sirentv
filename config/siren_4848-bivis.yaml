photonlib:
        filepath: /sdf/home/y/youngsam/sw/dune/siren-t/data/plib_2x2_module0_06052024_4848.h5
                
model:
    network:
        in_features: 3
        hidden_features: [1024, 512, 512]
        hidden_layers: [2, 2, 2]
        out_features: [48, 4800]
        outermost_linear: False
    ckpt_file: 
    output_scale:
        fix: True
transform_vis:
    vmax: 1.0
    eps: 1.e-8
    sin_out: True
data:
    dataset:
        #device: ''
        weight:
            method: bivis
            threshold: [1.e-8, 1.e-8]
            factor: [1.e+6, 5.e+3]
            idx_slices:
                - [null, 48]
                - [48, null]
    loader:
            batch_size: 4096
            num_workers: 4
            pin_memory: False
            drop_last: True
            shuffle: true
logger:
    type: wandb
    watch_grad: True
    dir_name: /sdf/home/y/youngsam/sw/dune/siren-t/data/results/logs_xyz_4848
    file_name: log.csv
    log_every_nstep: 5
    project: siren-2x2
    name: siren_4848-bivis-sweep
    analysis:
        vis_bias:
            threshold: 1.e-6
            idx_slice: [null, 48]
        time_bias:
            threshold: 1.e-6
            idx_slice: [48, null]
            normalize: False     # only compare shape
train:
    max_epochs: 500
    save_every_epochs: 125
    optimizer_class: Adam
    optimizer_param:
        lr: 5.e-7
    # scheduler_class: ReduceLROnPlateau
    # scheduler_param:
    #     factor: 0.1
    #     patience: 10
    # regularization:
    #     type: "l1"
    #     weight_decay: 1.e-6
    resume: False
    loss_fn:
        functions:
            - WeightedL2Loss
            - WeightedL2Loss
        weights:
            - 1.
            - 1.