# THROWAWAY smoke-test copy of stage1_gs_p3_omega030_s3df.yaml -- NOT a real ablation cell,
# safe to delete once the turing-memory question it exists to answer is answered.
#
# Only two things changed from the real config:
#   - grad_supervision_keys: coeffs warmup 1000 -> 0, so the expensive Hutchinson
#     double-backward path activates on iteration 1 instead of epoch 1000, and
#   - max_epochs: 5000 -> 1, dir_name/name renamed, so this can't be mistaken for real data.
# Everything else (architecture, batch size, chunk sizes) is untouched, since the whole point
# is to see whether THIS exact grad-supervision computation fits in an 11GB turing GPU.
compressed_plib:
    filepath: /sdf/data/neutrino/youngsam/compressed_plib_b05_quantile_log_prod_lite_n50.h5
    lazy: true
    n_components: 50
    n_photon: 3.0e7
    device: cpu
    normalize_coeffs: true
    evr_weight_coeffs: false
    weight_power: 3.0
raw_quantile_plib:
    filepath: /sdf/data/neutrino/pubdata/lut/optical/consolidated/full_wvfm_plib_b05_quantile_prod_lite_fixed.h5
    mode: quantile
physics:
    R_index: 1.233
device:
    type: cuda
model:
  ckpt_file: null
  mode: pca_cdf
  network:
    type: MultiBranchSiren
    in_features: 6
    n_components: 50
    outermost_linear: true
    branches:
      - name: v_net
        keys: [v]
        hidden_features: 256
        hidden_layers: 6
        first_omega_0: 30.0
        hidden_omega_0: 30.0
      - name: t0_net
        keys: [t0]
        hidden_features: 256
        hidden_layers: 6
        first_omega_0: 30.0
        hidden_omega_0: 30.0
      - name: coeff_net
        keys: [coeffs]
        hidden_features: 512
        hidden_layers: 6
        first_omega_0: 30.0
        hidden_omega_0: 30.0
  output_scale:
    fix: true
transform_vis:
    vmax: 1.0
    eps: 1.e-8
    sin_out: false
data:
    n_pmt: 81
    use_gradient_supervision: False
    weight:
      coeffs:
        enable: false
      v:
        enable: true
        factor: 5000.0
        threshold: 1.0e-08
      t0:
        enable: false
    loader:
      batch_size: 1024
      drop_last: true
      num_workers: 8
      prefetch_factor: 4
      pin_memory: true
      shuffle: true
      load_pos: true
    dataset:
      type: CompressedPLibDataset
logger:
    type: wandb
    entity: junjiex-stanford-university
    run_dir: /sdf/data/neutrino/junjie/SIREN/cider-ml/logs
    dir_name: logs_SMOKETEST_stage1_gs_p3_omega030
    file_name: log.csv
    grad_norm:
      enabled: true
      log_per_layer: true
      log_frequency: 5
    log_every_nsteps: 5
    project: sirentv_ablations
    name: SMOKETEST_stage1_gs_p3_omega030
    infer_fn:
      type: PCAInfer
    analysis:
      - func: bias
        suffix: coeffs
        key: coeffs
        threshold: null
      - func: bias
        suffix: vis
        key: v_linear
        threshold: 1.0e-06
      - func: abs_bias
        suffix: t0
        key: t0
        threshold: 1.0e-02
        signed: True
train:
    seed: 0
    clip_grad: {v_net: 1.0, t0_net: 1.0, coeff_net: 3.0}
    # --- gradient supervision forced ON from iteration 1 (warmup 0), NOT the real warmup=1000
    # -- this is the one deliberate deviation from the real config; see header comment. ---
    grad_supervision_keys: {coeffs: 0}
    grad_supervision_warmup_unit: epoch
    grad_supervision_aggregate: true
    grad_target_agg_chunk_size: 20000
    grad_target_n_projections: 100
    grad_target_chunk_size: 20000
    grad_target_cache_file: /sdf/data/neutrino/junjie/SIREN/cider-ml/sirentv/grad_frob_cache/dualpca_n50_grad_frob.h5
    loss:
      - type: WeightedL2Loss
        key: coeffs
        weight: 1.0
      - type: WeightedPoissonNLLLoss
        key: v
        weight: 1.0e-7
      - type: SmoothL1Loss
        key: t0
        weight: 1.0
      - type: WeightedGradFrobLoss
        key: coeffs
        weight: 1.0
    regularization: null
    reduction: sum
    max_epochs: 1
    optimizer_class: AdamW
    optimizer_param:
      lr: 1.0e-05
    resume: false
    save_every_epochs: 100
    save_every_iterations: -1
    scheduler_class: CosineAnnealingLR
    scheduler_param:
      T_max: 2000
      eta_min: 1.0e-07
