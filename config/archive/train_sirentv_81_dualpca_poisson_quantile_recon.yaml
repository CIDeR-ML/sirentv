compressed_plib:
    filepath: /sdf/data/neutrino/youngsam/compressed_plib_b05_quantile_log_prod_lite_n50.h5
    lazy: true
    n_components: 50
    n_photon: 3.0e7
    device: cpu
    normalize_coeffs: true
    evr_weight_coeffs: false
# eval-only: true (uncompressed) quantile function, for measuring the PCA-reconstruction
# ceiling (compressed target vs. raw) separately from model error. Ignored by training.
raw_quantile_plib:
    filepath: /sdf/data/neutrino/pubdata/lut/optical/consolidated/full_wvfm_plib_b05_quantile_prod_lite_fixed.h5
    mode: quantile
physics:
    R_index: 1.233
device:
    type: cuda
model:
  # deliberately no ckpt_file -- trains from scratch, so this is a clean ablation against the
  # baseline dualpca run rather than a fine-tune on top of it
  mode: pca_cdf
  network:
    type: DualPcaSiren
    in_features: 6
    hidden_features: [256, 512]   # [vt0_branch, coeff_branch]
    hidden_layers: [6, 6]         # [vt0_branch, coeff_branch]
    n_components: 50
    outermost_linear: true
    first_omega_0: 30.0
    hidden_omega_0: 30.0
  output_scale:
    fix: true
transform_vis:
    vmax: 1.0
    eps: 1.e-8
    sin_out: false
data:
    n_pmt: 81
    use_gradient_supervision: False  # legacy flag, unrelated to gradient supervision (not used in this ablation)
    weight:
      coeffs:
        enable: false
      v:
        enable: true
        factor: 5000.0
        threshold: 1.0e-08
      t0:
        enable: false
    loader:
      batch_size: 512
      drop_last: true
      num_workers: 4
      pin_memory: true
      shuffle: true
      load_pos: true
    dataset:
      type: CompressedPLibDataset
logger:
    type: wandb
    entity: junjiex-stanford-university
    run_dir: /sdf/data/neutrino/junjie/SIREN/cider-ml/logs
    dir_name: logs_pca_81_dual_poisson_quantile_recon
    file_name: log.csv
    grad_norm:
      enabled: true
      log_per_layer: true
      log_frequency: 77
    log_every_nsteps: 77
    project: sirentv-pca-81
    name: dualpca_siren_81_poisson_quantile_recon
    infer_fn:
      type: PCAInfer
    analysis:
      - func: bias
        suffix: coeffs
        key: coeffs
        threshold: null
      - func: bias
        suffix: vis
        key: v_linear
        threshold: 1.0e-06
      - func: abs_bias
        suffix: t0
        key: t0
        threshold: 1.0e-02
        signed: True
train:
    seed: 0
    clip_grad: {vt0_net: 1.0, coeff_net: 1.0}
    loss:
      # ablation: supervise on the RECONSTRUCTED quantile function (mean + coeffs @ components),
      # density-weighted by the target's own local steepness (see
      # train_sirentv_81_dualpca_quantile_recon.yaml -- this is that same loss), combined with
      # Poisson NLL on visibility (see train_sirentv_81_dualpca_poisson.yaml for the
      # derivation) -- no gradient supervision in this ablation. pca_mean/pca_components are
      # auto-injected by build_losses from this file's own compressed_plib section.
      - type: WeightedReconstructedQuantileLoss
        key: coeffs
        weight: 1.0
        power: 1.0
        eps: 1.0e-3
      # weight: STARTING GUESS ONLY, not empirically tuned (n_photon~3e7 makes this loss's raw
      # magnitude huge by design) -- check logged loss magnitudes on the first few hundred steps
      # and adjust so this term is comparable to the quantile-recon/t0 terms.
      - type: WeightedPoissonNLLLoss
        key: v
        weight: 1.0e-7
      - type: SmoothL1Loss
        key: t0
        weight: 1.0
    regularization: null
    reduction: sum
    max_epochs: 2000
    optimizer_class: AdamW
    optimizer_param:
      lr: 1.0e-05
    resume: false
    save_every_epochs: 100
    save_every_iterations: -1
    scheduler_class: CosineAnnealingLR
    scheduler_param:
      T_max: 2000
      eta_min: 1.0e-07
