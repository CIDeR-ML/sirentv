compressed_plib:
    filepath: /sdf/data/neutrino/youngsam/compressed_plib_b05_quantile_log_prod_lite_n50.h5
    lazy: true
    n_components: 50
    n_photon: &n_photon 3.0e7
    device: cpu
    normalize_coeffs: true
    weight_power: 3.0 # power of the standard deviation for the coefficient weight. Default is 1.0, which is equivalent to u/sigma penalty loss. 0 is the same as unormalized L2 loss, and 2 is the as plain L2 loss on the normalized coeffs.
    evr_weight_coeffs: false
# eval-only: true (uncompressed) quantile function, for measuring the PCA-reconstruction
# ceiling (compressed target vs. raw) separately from model error. Ignored by training.
raw_quantile_plib:
    filepath: /sdf/data/neutrino/pubdata/lut/optical/consolidated/full_wvfm_plib_b05_quantile_prod_lite_fixed.h5
    mode: quantile
physics:
    R_index: 1.233
device:
    type: cuda
model:
  # deliberately no ckpt_file -- trains from scratch, so this is a clean ablation against the
  # baseline dualpca run rather than a fine-tune on top of it
  mode: pca_cdf
  network:
    type: DualPcaSiren
    in_features: 6
    hidden_features: [256, 512]   # [vt0_branch, coeff_branch]
    hidden_layers: [6, 6]         # [vt0_branch, coeff_branch]
    n_components: 50
    outermost_linear: true
    first_omega_0: 30.0
    hidden_omega_0: 30.0
  output_scale:
    fix: true
transform_vis:
    vmax: 1.0
    eps: 1.e-8
    sin_out: false
data:
    n_pmt: 81
    use_gradient_supervision: False  # legacy flag, unrelated to grad_supervision_keys below
    weight:
      coeffs:
        enable: false
      v:
        enable: true
        factor: 5000.0
        threshold: 1.0e-08
      t0:
        enable: false
    loader:
      batch_size: 512
      drop_last: true
      num_workers: 4
      pin_memory: true
      shuffle: true
      load_pos: true
    dataset:
      type: CompressedPLibDataset
logger:
    type: wandb
    entity: junjiex-stanford-university
    run_dir: /sdf/data/neutrino/junjie/SIREN/cider-ml/logs
    dir_name: logs_pca_81_dual_grad_supervision
    file_name: log.csv
    grad_norm:
      enabled: true
      log_per_layer: true
      log_frequency: 77
    log_every_nsteps: 77
    project: sirentv-pca-81
    name: dualpca_siren_81_grad_supervision
    infer_fn:
      type: PCAInfer
    analysis:
      - func: bias
        suffix: coeffs
        key: coeffs
        threshold: null
      - func: bias
        suffix: vis
        key: v_linear
        threshold: 1.0e-06
      - func: abs_bias
        suffix: t0
        key: t0
        threshold: 1.0e-02
        signed: True
train:
    seed: 0
    clip_grad: {vt0_net: 1.0, coeff_net: 1.0}
    # for each key here: (1) CompressedPLibDataset precomputes a finite-difference target
    # "{key}_grad_frob" once at startup, and (2) SirenTV.forward computes a matching
    # Hutchinson-estimated prediction "{key}_grad_frob" every step (cost is O(n_pmts),
    # independent of the key's channel count -- same for "v" (1-dim) as "coeffs" (50-dim)).
    # A WeightedGradFrobLoss entry below is what actually turns this into a training signal.
    grad_supervision_keys: {v: 0, coeffs: 100}  # coeffs gradient supervision only starts once v has had time to converge -- see loss/grad_frob.py
    grad_supervision_warmup_unit: epoch  # or "iteration", for finer-grained control
    grad_supervision_aggregate: true  # per-PMT mode OOM'd; falling back to the visibility-weighted aggregate
    grad_target_agg_chunk_size: 20000  # null = no chunking (one-shot read); lower this further if still tight on memory
    # EXACT (native-resolution, no coarse-graining/subsampling) gradient target -- the earlier
    # subsample_factor + near-wall-refine two-tier approximation had a real, confirmed
    # systematic truncation-error bias at subsample_factor>1 that ensemble-averaging over many
    # PMTs/voxels could NOT fix (confirmed via a flat, non-decreasing disagreement-vs-N curve).
    # Multi-channel keys (coeffs/quantiles) are computed via a chunked Hutchinson random-
    # projection (same trick as the prediction-side estimator, applied on the target side
    # instead) so the full (N, n_pmt, K) array is never materialized -- see
    # compute_grad_frob_target_exact_projected. n_projections=100 averages over 100 independent
    # random directions (a single projection would be a biased, arbitrary-direction estimate
    # baked in for the whole run, unlike the prediction side which gets a fresh one every step)
    # -- picked from the ex-junjie.ipynb M-sweep as a good precision/cost tradeoff.
    # Deliberately NOT shared with the prediction side: there, M projections would cost M
    # backward passes/step (each projection needs its own torch.autograd.grad call), unlike
    # here where M projections cost barely more than 1 (one np.gradient call handles any
    # channel count) -- see compute_grad_frob_hutchinson's docstring for the full reasoning.
    grad_target_n_projections: 100
    grad_target_chunk_size: 20000  # coeffs is K=50: 20000*81*50*4 bytes ~= 324MB/chunk; null = no chunking (one-shot read)
    # The source LUT above is owned by youngsam (not writable by us), so the expensive
    # per-(voxel, PMT) gradient target can't be cached inside it -- cached HERE instead, in a
    # small sidecar file we own. Shared with smoke_train_sirentv_81_dualpca_grad_supervision.yaml
    # (identical n_photon/xform/normalize_coeffs/n_projections), so precomputing once via
    # `python -m sirentv.scripts.precompute_grad_frob_targets --config <this file>` (optionally
    # --device cuda) serves both configs. If this file doesn't exist yet or its config-derived
    # meta doesn't match, _precompute_grad_targets falls back to computing in-process (slow) and
    # writes the cache itself, so this is safe to set even before running the script.
    grad_target_cache_file: /sdf/data/neutrino/junjie/SIREN/cider-ml/sirentv/grad_frob_cache/dualpca_n50_grad_frob.h5
    loss:
      - type: WeightedL2Loss
        key: coeffs
        weight: 1.0
      - type: WeightedPoissonNLLLoss
        key: v
        weight: 1.0e-7
      - type: SmoothL1Loss
        key: t0
        weight: 1.0
      # Both weights below are a SECOND-ROUND empirical correction, from an actual smoke-test
      # run (500+ iterations, reduction:sum): with weight=1.0/scale=*n_photon on "v" and
      # weight=1.0 on "coeffs", the two grad_frob terms landed at ~300-1500 (v) vs ~0.001-0.004
      # (coeffs) -- 5-6 orders of magnitude apart, and "v" alone was 100-1000x larger than
      # every OTHER loss term combined (coeffs~0.35, poisson_v~2.4, t0~1.5), so it was
      # dominating the total gradient direction and stalling poisson_v's convergence. These
      # values pull both terms toward the same O(1-3) range as the rest -- still a STARTING
      # GUESS, re-check logged magnitudes after this change and keep iterating.
      # scale (v only): grad_frob is the spatial derivative of xform_vis(vis/n_photon) --
      # dividing by n_photon crushes its magnitude regardless of fit quality; scale: *n_photon
      # undoes exactly that division (stays in sync with compressed_plib.n_photon above via the
      # YAML anchor/alias), and weight then does the remaining empirical rebalancing on top.
      # coeffs isn't divided by n_photon, so no scale is needed there, only weight.
      - type: WeightedGradFrobLoss
        key: v
        weight: 2.0e-3
        scale: *n_photon
      - type: WeightedGradFrobLoss
        key: coeffs
        weight: 1.0e3
    regularization: null
    reduction: sum
    max_epochs: 2000
    optimizer_class: AdamW
    optimizer_param:
      lr: 1.0e-05
    resume: false
    save_every_epochs: 100
    save_every_iterations: -1
    scheduler_class: CosineAnnealingLR
    scheduler_param:
      T_max: 2000
      eta_min: 1.0e-07
