photonlib:
    filepath: /sdf/data/neutrino/pubdata/lut/optical/consolidated/full_wvfm_plib_b05_quantile_prod_lite_fixed.h5
    lazy: true
    mode: log_quantile
    combine_every_quantile: 2
    n_photon: 3.0e7
    device: cpu
physics:
    R_index: 1.233
device:
    type: cuda
model:
  # deliberately no ckpt_file -- trains from scratch, so this is a clean ablation against the
  # baseline quantile run rather than a fine-tune on top of it
  mode: quantile_cdf
  network:
    type: QuantileSiren
    in_features: 6
    hidden_features: 512
    hidden_layers: 6
    n_quantile: 256
    outermost_linear: true
    first_omega_0: 30.0
    hidden_omega_0: 30.0
  output_scale:
    fix: true
transform_vis:
    vmax: 1.0
    eps: 1.e-8
    sin_out: false
data:
    n_pmt: 81
    weight:
      quantiles:
        enable: false
      v:
        enable: true
        factor: 5000.0
        threshold: 1.0e-08
      t0:
        enable: false
    loader:
      batch_size: 512
      drop_last: true
      num_workers: 4
      pin_memory: true
      shuffle: true
      load_pos: true
    dataset:
      type: QuantilePLibDataset
logger:
    type: wandb
    entity: junjiex-stanford-university
    run_dir: /sdf/data/neutrino/junjie/SIREN/cider-ml/logs
    dir_name: logs_quantile_81_poisson_density_weighted
    file_name: log.csv
    grad_norm:
      enabled: true
      log_per_layer: true
      log_frequency: 77
    log_every_nsteps: 77
    project: sirentv-quantile-81
    name: quantile_siren_81_poisson_density_weighted
    infer_fn:
      type: QuantileInfer
    analysis:
      - func: bias
        suffix: vis
        key: v_linear
        threshold: 1.0e-06
      - func: abs_bias
        suffix: t0
        key: t0
        threshold: 1.0e-02
        signed: True
train:
  seed: 0
  clip_grad: 1.0
  loss:
    # ablation: density-weighted L2 directly on the model's own quantile-function output (same
    # WeightedReconstructedQuantileLoss as train_sirentv_81_quantile_density_weighted.yaml --
    # no compressed_plib section present anywhere in this file, so build_losses leaves
    # pca_mean/pca_components as None and this reduces to a no-reconstruction-step version),
    # combined with Poisson NLL on visibility (see train_sirentv_81_dualpca_poisson.yaml for
    # the derivation) -- no gradient supervision in this ablation.
    - type: WeightedReconstructedQuantileLoss
      key: quantiles
      mask_key: quantiles_mask
      weight: 1.0
      power: 1.0
      eps: 1.0e-3
    # weight: STARTING GUESS ONLY, not empirically tuned (n_photon~3e7 makes this loss's raw
    # magnitude huge by design) -- check logged loss magnitudes on the first few hundred steps
    # and adjust so this term is comparable to the quantile-recon/t0 terms.
    - type: WeightedPoissonNLLLoss
      key: v
      weight: 1.0e-7
    - type: SmoothL1Loss
      key: t0
      weight: 1.0
  regularization: null
  reduction: sum
  max_epochs: 2000
  optimizer_class: AdamW
  optimizer_param:
    lr: 1.0e-05
  resume: false
  save_every_epochs: 100
  save_every_iterations: -1
  scheduler_class: CosineAnnealingLR
  scheduler_param:
    T_max: 2000
    eta_min: 1.0e-07
