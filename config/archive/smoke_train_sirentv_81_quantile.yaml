data:
  dataset:
    type: QuantilePLibDataset
  loader:
    batch_size: 512
    drop_last: true
    load_pos: true
    num_workers: 4
    pin_memory: true
    shuffle: true
  n_pmt: 81
  weight:
    quantiles:
      enable: false
    t0:
      enable: false
    v:
      enable: true
      factor: 5000.0
      threshold: 1.0e-08
device:
  type: cuda
logger:
  analysis:
  - func: bias
    key: v_linear
    suffix: vis
    threshold: 1.0e-06
  - func: abs_bias
    key: t0
    signed: true
    suffix: t0
    threshold: 0.01
  dir_name: /sdf/data/neutrino/junjie/SIREN/cider-ml/logs/smoke_logs_quantile_81
  entity: junjiex-stanford-university
  file_name: log.csv
  grad_norm:
    enabled: true
    log_frequency: 77
    log_per_layer: true
  log_every_nsteps: 77
  name: quantile_siren_81
  project: sirentv-quantile-81
  run_dir: /sdf/data/neutrino/junjie/SIREN/cider-ml/logs
  type: wandb
model:
  ckpt_file: null
  mode: quantile_cdf
  network:
    first_omega_0: 30.0
    hidden_features: 512
    hidden_layers: 6
    hidden_omega_0: 30.0
    in_features: 6
    n_quantile: 256
    outermost_linear: true
    type: QuantileSiren
  output_scale:
    fix: true
photonlib:
  combine_every_quantile: 2
  device: cpu
  filepath: /sdf/data/neutrino/pubdata/lut/optical/consolidated/full_wvfm_plib_b05_quantile_prod_lite_fixed.h5
  lazy: true
  mode: log_quantile
  n_photon: 3.0e7
physics:
  R_index: 1.233
train:
  seed: 0
  clip_grad: 1.0
  loss:
  - key: quantiles
    type: WeightedL2Loss
    weight: 1.0
  - key: v
    type: SmoothL1Loss
    weight: 1.0
  - key: t0
    type: SmoothL1Loss
    weight: 1.0
  max_epochs: 1
  optimizer_class: AdamW
  optimizer_param:
    lr: 1.0e-05
  reduction: sum
  regularization: null
  resume: false
  save_every_epochs: 1
  save_every_iterations: -1
  scheduler_class: CosineAnnealingLR
  scheduler_param:
    T_max: 2000
    eta_min: 1.0e-07
transform_vis:
  eps: 1.0e-08
  sin_out: false
  vmax: 1.0
