compressed_plib:
    filepath: /sdf/data/neutrino/youngsam/compressed_plib_b05_quantile_log_prod_lite_n50.h5
    lazy: true
    n_components: 50
    n_photon: &n_photon 3.0e7
    device: cpu
    normalize_coeffs: true
    weight_power: 3.0 # power of the standard deviation for the coefficient weight. Default is 1.0, which is equivalent to u/sigma penalty loss. 0 is the same as unormalized L2 loss, and 2 is the as plain L2 loss on the normalized coeffs.
    evr_weight_coeffs: false
# eval-only: true (uncompressed) quantile function, for measuring the PCA-reconstruction
# ceiling (compressed target vs. raw) separately from model error. Ignored by training.
raw_quantile_plib:
    filepath: /sdf/data/neutrino/pubdata/lut/optical/consolidated/full_wvfm_plib_b05_quantile_prod_lite_fixed.h5
    mode: quantile
physics:
    R_index: 1.233
device:
    type: cuda
model:
  # deliberately no ckpt_file -- trains from scratch, so this is a clean ablation against the
  # baseline dualpca run rather than a fine-tune on top of it
  mode: pca_cdf
  network:
    type: DualPcaSiren
    in_features: 6
    hidden_features: [256, 512]   # [vt0_branch, coeff_branch]
    hidden_layers: [6, 6]         # [vt0_branch, coeff_branch]
    n_components: 50
    outermost_linear: true
    first_omega_0: 30.0
    hidden_omega_0: 30.0
  output_scale:
    fix: true
transform_vis:
    vmax: 1.0
    eps: 1.e-8
    sin_out: false
data:
    n_pmt: 81
    use_gradient_supervision: False  # legacy flag, unrelated to grad_supervision_keys below
    weight:
      coeffs:
        enable: false
      v:
        enable: true
        factor: 5000.0
        threshold: 1.0e-08
      t0:
        enable: false
    loader:
      batch_size: 512
      drop_last: true
      num_workers: 4
      pin_memory: true
      shuffle: true
      load_pos: true
    dataset:
      type: CompressedPLibDataset
logger:
    type: wandb
    entity: junjiex-stanford-university
    run_dir: /sdf/data/neutrino/junjie/SIREN/cider-ml/logs
    dir_name: logs_pca_81_dual_grad_supervision_coeffs_only
    file_name: log.csv
    grad_norm:
      enabled: true
      log_per_layer: true
      log_frequency: 77
    log_every_nsteps: 77
    project: sirentv-pca-81
    name: dualpca_siren_81_grad_supervision_coeffs_only
    infer_fn:
      type: PCAInfer
    analysis:
      - func: bias
        suffix: coeffs
        key: coeffs
        threshold: 1.0e-06
      - func: bias
        suffix: vis
        key: v_linear
        threshold: 1.0e-06
      - func: abs_bias
        suffix: t0
        key: t0
        threshold: 1.0e-02
        signed: True
train:
    clip_grad: {vt0_net: 1.0, coeff_net: 3.0}
    # ABLATION vs. train_sirentv_81_dualpca_grad_supervision.yaml: "v" is dropped from
    # grad_supervision_keys entirely (not just given a longer warmup). Rationale: the
    # ex-junjie.ipynb concentration check showed v's own gradient target is EXTREMELY
    # concentrated (top 1% of voxels -- the near-PMT region -- hold 96.9% of the total
    # sum(target_val); top 10% hold 99.4%). Those same near-PMT voxels are also exactly where
    # WeightedPoissonNLLLoss(v) is already most informative (Poisson relative uncertainty
    # shrinks like 1/sqrt(n), so high-photon-count near-PMT voxels get the tightest NLL
    # constraint on their own) -- so v's grad_frob term was mostly duplicating supervision the
    # NLL term already concentrates on the same region, while empirically dominating v's loss
    # ~40:1 over the NLL term and measurably degrading it (NLL_v plateaued at ~0.025 in the
    # full grad-supervision run, vs <0.001 for non-grad-supervision baselines). A longer warmup
    # doesn't fix this -- the two terms would still collide over the same voxels once warmup
    # ends, just later in training (and at a lower LR, under CosineAnnealingLR) -- so this
    # config removes v's grad_frob term outright instead of delaying it.
    # "coeffs" keeps its own 100-epoch warmup: that's unrelated to v's grad_frob (still about
    # letting v's OWN fit -- via Poisson NLL, independent of grad supervision -- converge
    # first, since coeffs' aggregation weighting depends on v's predicted visibility via
    # SirenTV.forward's vis_weight, regardless of whether v itself gets grad_frob supervision).
    grad_supervision_keys: {coeffs: 100}
    grad_supervision_warmup_unit: epoch  # or "iteration", for finer-grained control
    grad_supervision_aggregate: true  # per-PMT mode OOM'd; falling back to the visibility-weighted aggregate
    grad_target_agg_chunk_size: 20000  # null = no chunking (one-shot read); lower this further if still tight on memory
    # EXACT (native-resolution, no coarse-graining/subsampling) gradient target -- the earlier
    # subsample_factor + near-wall-refine two-tier approximation had a real, confirmed
    # systematic truncation-error bias at subsample_factor>1 that ensemble-averaging over many
    # PMTs/voxels could NOT fix (confirmed via a flat, non-decreasing disagreement-vs-N curve).
    # Multi-channel keys (coeffs/quantiles) are computed via a chunked Hutchinson random-
    # projection (same trick as the prediction-side estimator, applied on the target side
    # instead) so the full (N, n_pmt, K) array is never materialized -- see
    # compute_grad_frob_target_exact_projected. n_projections=100 averages over 100 independent
    # random directions (a single projection would be a biased, arbitrary-direction estimate
    # baked in for the whole run, unlike the prediction side which gets a fresh one every step)
    # -- picked from the ex-junjie.ipynb M-sweep as a good precision/cost tradeoff.
    # Deliberately NOT shared with the prediction side: there, M projections would cost M
    # backward passes/step (each projection needs its own torch.autograd.grad call), unlike
    # here where M projections cost barely more than 1 (one np.gradient call handles any
    # channel count) -- see compute_grad_frob_hutchinson's docstring for the full reasoning.
    grad_target_n_projections: 100
    grad_target_chunk_size: 20000  # coeffs is K=50: 20000*81*50*4 bytes ~= 324MB/chunk; null = no chunking (one-shot read)
    # Same sidecar cache as train_sirentv_81_dualpca_grad_supervision.yaml (identical LUT/
    # n_photon/xform/normalize_coeffs/weight_power/n_components/n_projections, so the meta
    # matches exactly): only the "coeffs" entry is read from it now (grad_supervision_keys no
    # longer requests "v"), so this reuses the SAME cache file the "v"-included run already
    # populated/will populate -- no need to regenerate anything, no need for a separate cache.
    grad_target_cache_file: /sdf/data/neutrino/junjie/SIREN/cider-ml/sirentv/grad_frob_cache/dualpca_n50_grad_frob.h5
    loss:
      - type: WeightedL2Loss
        key: coeffs
        weight: 1.0
      - type: WeightedPoissonNLLLoss
        key: v
        weight: 1.0e-7
      - type: SmoothL1Loss
        key: t0
        weight: 1.0
      # coeffs isn't divided by n_photon, so no scale is needed here, only weight -- see
      # train_sirentv_81_dualpca_grad_supervision.yaml for the empirical-tuning history behind
      # this value (still a STARTING GUESS pending the broader loss-weight re-check flagged
      # there: grad_frob(coeffs)+grad_frob(v) together were found to make up ~87% of total loss
      # in that run; with v's term removed here, re-check logged magnitudes early and re-tune
      # this weight against the (now v-grad-frob-free) total before trusting a long run).
      - type: WeightedGradFrobLoss
        key: coeffs
        weight: 1.0
    regularization: null
    reduction: sum
    max_epochs: 2000
    optimizer_class: AdamW
    optimizer_param:
      lr: 1.0e-05
    resume: false
    save_every_epochs: 100
    save_every_iterations: -1
    scheduler_class: CosineAnnealingLR
    scheduler_param:
      T_max: 2000
      eta_min: 1.0e-07
