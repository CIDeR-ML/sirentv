photonlib:
  filepath: tiny_photonlib.h5
  lazy: true
  time_tick_size: 0.1

model:
  ckpt_file: null
  mode: cdf
  network:
    type: BranchedSiren
    in_features: 3
    hidden_features: [8, 8, 8]
    hidden_layers: [2, 2, 2]
    out_features: [1, 9]
    outermost_linear: true
    steepness_factor: 5.0
  output_scale:
    fix: true

transform_vis:
  vmax: 1.0
  eps: 1.0e-8
  sin_out: false

data:
  n_photon: 1
  n_pmt: 2
  dataset:
    type: PLibDataset
  weight:
    t:
      enable: false
    v:
      enable: false
  loader:
    batch_size: 2
    drop_last: false
    load_pos: false
    num_workers: 0
    pin_memory: false
    shuffle: false

logger:
  type: csv
  dir_name: tiny-logs
  file_name: log.csv
  log_every_nsteps: 1

train:
  compile: false
  max_iterations: 2
  max_epochs: 1
  optimizer_class: Adam
  optimizer_param:
    lr: 1.0e-3
  resume: false
  reduction: sum
  regularization: null
  save_every_epochs: -1
  save_every_iterations: -1
  loss:
    - type: SmoothL1Loss
      key: t
      weight: 1.0
    - type: SmoothL1Loss
      key: v
      weight: 1.0
