photonlib:
        filepath: /sdf/home/y/youngsam/sw/dune/siren-t/data/plib_2x2_module0_06052024_4848.h5
                
model:
    network:
        in_features: 3
        hidden_features: [4096, 128, 2048]
        hidden_layers: [3, 3, 3]
        out_features: [48, 4800]
    ckpt_file: 
    output_scale:
        fix: True
transform_vis:
    vmax: 1.0
    eps: 1.e-8
    sin_out: True
data:
    dataset:
        #device: ''
        weight:
            method: "bivis"
            threshold: [1.e-8, 1.e-8]
            factor: [1.e+6, 5.e+3]
            idx_slices:
                - [0, 48]
                - [48, null]
    loader:
            batch_size: 4096
            num_workers: 4
            pin_memory: True
            drop_last: True
            shuffle: true
logger:
    dir_name: /sdf/home/y/youngsam/sw/dune/siren-t/logs_vxyzt4848_bivis_weighting
    file_name: log.csv
    log_every_nstep: 5
    analysis:
        vis_bias:
            threshold: 1.e-6
            idx_slice: [null, 48]
        time_bias:
            threshold: 1.e-6
            idx_slice: [48, null]
            normalize: True     # only compare shape
train:
    max_epochs: 5000
    save_every_epochs: 10
    optimizer_class: Adam
    optimizer_param:
        lr: 5.e-6
    # scheduler_class: ReduceLROnPlateau
    # scheduler_param:
    #     factor: 0.1
    #     patience: 10
    resume: False
    loss_fn:
        functions:
            - WeightedL2Loss
            - WeightedL2Loss
        weights:
            - 1.
            - 1.