

device:
  type: cuda
data:
  weight:
    t:
      enable: false
      factor: 1000000.0
      threshold: 1.0e-08
    v:
      enable: true
      factor: 5000.0
      threshold: 1.0e-08
  loader:
    batch_size: 4096
    drop_last: true
    num_workers: 4
    pin_memory: true
    shuffle: true
logger:
  analysis:
    bias:
      key: t_linear
      threshold: 1.0e-06
    bias:
      key: v_linear
      threshold: 1.0e-06
  dir_name: /sdf/home/y/youngsam/sw/dune/siren-t/data/results/logs_xyz_81081_bivis_weighting_csirentv
  file_name: log.csv
  log_every_nstep: 8
  name: praellel_siren_81000
  project: siren-larcube
  type: wandb
model:
  ckpt_file: null
  mode: cdf
  network:
    type: ParallelSiren # or ConditionalSiren or BranchedSiren...
    use_low_rank_fusion: true
    rank_vis: 128
    rank_time: 512
    fusion_activation: sigmoid
    fusion_omega0: 30.0
    in_features: 3
    hidden_features_pos: 4096
    hidden_layers_pos: 3
    hidden_features_time: 2048
    hidden_layers_time: 3
    embedding_dim: 512
    n_pmts: 81
    n_time_steps: 999
    pmt_pos_path: /sdf/home/y/youngsam/sw/dune/sim/sirentv/templates/pmt_pos.csv
    out_features: [81, 81000]
  output_scale:
    fix: true
photonlib:
  filepath: /sdf/data/neutrino/pubdata/lut/optical/waveform_map/batch02/consolidated/plib.h5
  lazy: true
train:
  loss:
    - type: SmoothL1Loss
      key: t
      weight: 1.0
    - type: SmoothL1Loss
      key: v
      weight: 1.0
    regularization: null
    reduction: sum
  max_epochs: 500
  optimizer_class: AdamW
  optimizer_param:
    lr: 1.0e-06
  resume: false
  save_every_epochs: 500
  scheduler_class: ReduceLROnPlateau
  scheduler_param:
    patience: 10
    factor: 0.5
    verbose: true
transform_vis:
  eps: 1.0e-08
  sin_out: false
  vmax: 1.0
