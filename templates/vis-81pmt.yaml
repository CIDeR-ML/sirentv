photonlib:
    filepath: /sdf/data/neutrino/pubdata/lut/optical/waveform_map/batch02/consolidated/plib.h5
    lazyload: True
device: 
    type: 'cuda:1'    
model:
    network:
        in_features: 3
        hidden_features: [512, 256, 256]
        hidden_layers: [2, 3, 3]
        out_features: [81, 81000]
        outermost_linear: True
        model_uncertainty: False
    ckpt_file: 
    output_scale:
        fix: True
transform_vis:
    vmax: 1.0
    eps: 1.e-7
    sin_out: True
data:
    dataset:
        weight:
            method: "vis"
            n_photon: 200000
            threshold: 1.e-8
            factor: 1.e+6
    loader:
        batch_size: 1024
        num_workers: 4
        pin_memory: True
        drop_last: True
        shuffle: true
logger:
    type: wandb
    dir_name: /sdf/home/j/junjie/sdf-data/FM/log/sirentv/logs_xyz_81_vis_weighting
    file_name: log.csv
    log_every_nstep: 8
    project: siren-81
    name: siren_81-vis

    analysis:
        vis_bias:
            threshold: 1.e-6
            idx_slice: [null, 81]
        time_bias:
            threshold: 1.e-3
            idx_slice: [81, null]
            normalize: False     # only compare shape
train:
    max_epochs: 5
    save_every_epochs: 5
    optimizer_class: Adam
    optimizer_param:
        lr: 2.e-6
    scheduler_class: ReduceLROnPlateau
    scheduler_param:
        verbose: True
        # factor: 0.1
        # patience: 10
    resume: False
    loss_fn:
        functions:
            - WeightedL2Loss
            - WeightedL2Loss
        weights:
            - 1.
            - 1.
        uncertainty:
            - False
            - False
        reduction: geometric_mean