compressed_plib:
  device: cpu
  evr_weight_coeffs: false
  filepath: /sdf/data/neutrino/youngsam/compressed_plib_b05_quantile_log_prod_lite_n50.h5
  lazy: true
  n_components: 50
  n_photon: 3.0e7
  normalize_coeffs: true
  weight_power: 3.0
data:
  dataset:
    type: CompressedPLibDataset
  loader:
    batch_size: 1024
    drop_last: true
    load_pos: true
    num_workers: 8
    pin_memory: true
    prefetch_factor: 4
    shuffle: true
  n_pmt: 81
  use_gradient_supervision: false
  weight:
    coeffs:
      enable: false
    t0:
      enable: false
    v:
      enable: true
      factor: 5000.0
      threshold: 1.0e-08
debug_timing: false
device:
  type: cuda
logger:
  analysis:
  - func: bias
    suffix: coeffs
    key: coeffs
    threshold: null
  - func: bias
    suffix: vis
    key: v_linear
    threshold: 1.0e-06
  - func: abs_bias
    suffix: t0
    key: t0
    signed: true
    threshold: 0.01
  dir_name: logs_stage1_gs_p3_omega030
  entity: junjiex-stanford-university
  file_name: log.csv
  grad_norm:
    enabled: true
    log_frequency: 77
    log_per_layer: true
  infer_fn:
    type: PCAInfer
  log_every_nsteps: 77
  name: stage1_gs_p3_omega030
  project: sirentv_ablations
  run_dir: /sdf/data/neutrino/junjie/SIREN/cider-ml/logs
  type: wandb
model:
  ckpt_file: /sdf/data/neutrino/junjie/SIREN/cider-ml/logs/logs_stage1_gs_p3_omega030/version-01/iteration-778000-epoch-2000.ckpt
  mode: pca_cdf
  network:
    branches:
    - first_omega_0: 30.0
      hidden_features: 256
      hidden_layers: 6
      hidden_omega_0: 30.0
      keys:
      - v
      name: v_net
    - first_omega_0: 30.0
      hidden_features: 256
      hidden_layers: 6
      hidden_omega_0: 30.0
      keys:
      - t0
      name: t0_net
    - first_omega_0: 30.0
      hidden_features: 512
      hidden_layers: 6
      hidden_omega_0: 30.0
      keys:
      - coeffs
      name: coeff_net
    in_features: 6
    n_components: 50
    outermost_linear: true
    type: MultiBranchSiren
    use_CDF: false
    xform_vis: &id001
      eps: 1.0e-08
      sin_out: false
      vmax: 1.0
  output_scale:
    fix: true
physics:
  R_index: 1.233
raw_quantile_plib:
  filepath: /sdf/data/neutrino/pubdata/lut/optical/consolidated/full_wvfm_plib_b05_quantile_prod_lite_fixed.h5
  mode: quantile
train:
  clip_grad:
    coeff_net: 3.0
    t0_net: 1.0
    v_net: 1.0
  grad_supervision_aggregate: true
  grad_supervision_keys:
    coeffs: 1000
  grad_supervision_warmup_unit: epoch
  grad_target_agg_chunk_size: 20000
  grad_target_cache_file: /sdf/data/neutrino/junjie/SIREN/cider-ml/sirentv/grad_frob_cache/dualpca_n50_grad_frob.h5
  grad_target_chunk_size: 20000
  grad_target_n_projections: 100
  loss:
  - key: coeffs
    type: WeightedL2Loss
    weight: 1.0
  - key: v
    type: WeightedPoissonNLLLoss
    weight: 1.0e-07
  - key: t0
    type: SmoothL1Loss
    weight: 1.0
  - key: coeffs
    type: WeightedGradFrobLoss
    weight: 1.0
  max_epochs: 3000
  optimizer_class: AdamW
  optimizer_param:
    lr: 1.0e-05
  reduction: sum
  regularization: null
  resume: true
  save_every_epochs: 100
  save_every_iterations: -1
  scheduler_class: CosineAnnealingLR
  scheduler_param:
    T_max: 2000
    eta_min: 1.0e-07
  seed: 0
transform_vis: *id001
